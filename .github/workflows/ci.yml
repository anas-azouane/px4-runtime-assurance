name: safety-monitor

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch_deps.sh
      - run: pip install -r requirements.txt
      - name: Rule unit tests under ASan and UBSan
        run: make -C monitor/tests test
      - name: Statement and decision coverage of rules/ and arbiter.c
        run: make -C monitor/tests coverage
      - name: Traceability
        run: python3 tools/check_traceability.py

  build-fw:
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.28.0
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch_deps.sh
      - name: West workspace at Zephyr 4.4
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.4.0 /tmp/zp
          cd /tmp/zp
          west update --narrow -o=--depth=1 zephyr cmsis_6 hal_stm32 open-amp libmetal picolibc
      - name: Cross-compile for the M4
        run: |
          ZEPHYR_BASE=/tmp/zp/zephyr west -z /tmp/zp/zephyr build \
            -b stm32mp157c_dk2 -d build-fw monitor
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-elf
          path: build-fw/zephyr/zephyr.elf

  # Flies every scenario against the same sources built for the PC. Catches rule
  # and escalation regressions on PRs from forks, which never reach the board.
  sitl:
    runs-on: [self-hosted, px4-sitl]
    needs: unit
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch_deps.sh
      - run: make -C monitor/host
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Fly scenarios
        run: .venv/bin/python tools/run_scenario.py scenarios/SC-*.yaml --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitl-results
          path: results/

  # SITL is too heavy for the A7, so the PC runner hosts it and drives the board
  # over SSH. Only this job measures the M4's real timing.
  hil:
    runs-on: [self-hosted, px4-sitl, mp157-attached]
    needs: [build-fw, sitl]
    timeout-minutes: 60
    concurrency:
      group: hil-board
      cancel-in-progress: false
    env:
      BOARD: ${{ vars.MP157_SSH }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch_deps.sh
      - uses: actions/download-artifact@v4
        with:
          name: monitor-elf
          path: fw/
      - name: Flash the M4 through remoteproc
        run: |
          scp fw/zephyr.elf "$BOARD:/tmp/safety_monitor.elf"
          ssh "$BOARD" /opt/safety/deploy_m4.sh /tmp/safety_monitor.elf
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Fly scenarios
        run: .venv/bin/python tools/run_scenario.py scenarios/SC-*.yaml --board "$BOARD" --out results
      - name: Stop the M4
        if: always()
        run: ssh "$BOARD" 'echo stop > /sys/class/remoteproc/remoteproc0/state' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-results
          path: results/
