name: safety-monitor

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tools/fetch_deps.sh
      - run: pip install -r requirements.txt
      - name: Rule unit tests under ASan and UBSan
        run: make -C monitor/tests test
      - name: Statement and decision coverage of rules/ and arbiter.c
        run: make -C monitor/tests coverage
      - name: Traceability
        run: python tools/check_traceability.py

  build-fw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ninja-build
      - run: pip install west
      - run: tools/fetch_deps.sh
      - name: Cross-compile for the M4
        run: tools/build_fw.sh
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-elf
          path: build-fw/zephyr/zephyr.elf

  # Flies every scenario against the monitor built for the PC. Everything is
  # built from scratch each run, about 40 minutes in all.
  sitl:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 90
    env:
      PX4_DIR: ${{ github.workspace }}/../PX4-Autopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch PX4 v1.16.2
        run: |
          git clone --branch v1.16.2 --depth 1 --recursive --shallow-submodules \
            https://github.com/PX4/PX4-Autopilot.git "$PX4_DIR"
          # The version script needs a NuttX tag, which a shallow clone leaves out.
          git -C "$PX4_DIR/platforms/nuttx/NuttX/nuttx" fetch --depth 1 origin tag nuttx-12.12.0
      - name: SITL image
        run: docker build -t px4-sitl:v1.16.2 -f tools/sitl/Dockerfile "$PX4_DIR/Tools/setup"
      - run: pip install -r requirements.txt
      - name: Build PX4
        run: python tools/sitl.py
      - run: tools/fetch_deps.sh
      - run: make -C monitor/host
      # Fails in minutes instead of once per scenario, and shows why.
      - name: Check that SITL starts
        env:
          GZ_VERBOSE: "3"
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import sitl
          sitl.start()
          try:
              sitl.wait_ready()
              print(sitl.logs()[-3000:])
          except TimeoutError:
              # GitHub keeps 4096 characters per annotation, so drop colour
              # codes and service listings, and split the rest.
              import re, subprocess
              ps = subprocess.run(["docker", "exec", sitl.CONTAINER, "ps", "-eo", "pid,stat,etime,args"],
                                  capture_output=True, text=True).stdout
              log = re.sub(r"\x1b\[[0-9;]*m", "", sitl.logs())
              lines = [l for l in log.splitlines() if " service on [" not in l and "wrench" not in l]
              text = "\n".join(lines[-150:]) + "\n--- ps ---\n" + ps
              chunks = [text[i:i + 3800] for i in range(0, len(text), 3800)][-8:]
              for n, c in enumerate(chunks):
                  c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title=SITL start {n + 1}/{len(chunks)}::{c}")
              sys.exit(1)
          finally:
              sitl.stop()
          PY
      - name: Fly scenarios
        run: python tools/run_scenario.py scenarios/SC-*.yaml --out results
      # Annotations are readable without signing in, unlike job logs and artifacts.
      - name: Annotate PX4 logs of failed runs
        if: failure()
        run: |
          for f in results/*.px4.log; do
            tail -n 30 "$f" | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\\r', '').replace('\\n', '%0A'); print(f'::error title={sys.argv[1]}::{t}')" "$(basename "$f")"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitl-results
          path: results/

  # Needs a self-hosted runner next to the board, so it only runs once the
  # MP157_SSH repository variable is set.
  hil:
    if: vars.MP157_SSH != ''
    runs-on: [self-hosted, px4-sitl, mp157-attached]
    needs: [build-fw, sitl]
    timeout-minutes: 60
    concurrency:
      group: hil-board
      cancel-in-progress: false
    env:
      BOARD: ${{ vars.MP157_SSH }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch_deps.sh
      - uses: actions/download-artifact@v4
        with:
          name: monitor-elf
          path: fw/
      - name: Flash the M4 through remoteproc
        run: |
          scp fw/zephyr.elf "$BOARD:/tmp/safety_monitor.elf"
          ssh "$BOARD" /opt/safety/deploy_m4.sh /tmp/safety_monitor.elf
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Fly scenarios
        run: .venv/bin/python tools/run_scenario.py scenarios/SC-*.yaml --board "$BOARD" --out results
      - name: Stop the M4
        if: always()
        run: ssh "$BOARD" 'echo stop > /sys/class/remoteproc/remoteproc0/state' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-results
          path: results/
