CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n
# libmetal allocates its device list from the kernel heap at init. The
# monitor itself never allocates.
CONFIG_HEAP_MEM_POOL_SIZE=1024

CONFIG_FPU=y
# The RX thread and the periodic task both use floats and one preempts the other.
CONFIG_FPU_SHARING=y
CONFIG_PICOLIBC=y
CONFIG_MAIN_STACK_SIZE=2048

# Console in the remoteproc trace buffer, read from the A7. No UART.
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
CONFIG_CONSOLE=y
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_CBPRINTF_NANO=y

CONFIG_ASSERT=n
